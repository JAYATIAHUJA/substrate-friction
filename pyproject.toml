[project]
name = "substrate-friction"
version = "0.1.0"
description = "Predict AI coding agent failure from code graph structure, on HydraDB"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.28",
    "httpx>=0.27",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "unidiff>=0.7.5",
    "datasets>=2.20",
    "networkx>=3.3",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "rich>=13.7",
    "protobuf>=5.27",
    "grpcio-tools>=1.64",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-timeout>=2.3"]

[project.scripts]
friction = "friction.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engine: requires a running HydraDB node"]
timeout = 300
