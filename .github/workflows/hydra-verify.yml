name: HydraDB verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/hydra-verify.yml"

permissions:
  contents: read

jobs:
  tests:
    name: tests + gate (verdict reproduced)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --extra dev

      - name: Unit tests (no engine)
        run: uv run pytest -q -m "not engine"

      - name: The gate itself must run from the repo
        run: |
          uv run python scripts/gate_report.py --out /tmp/gate.md
          uv run friction gate --arm arm_b --json > /tmp/gate.json || true
          uv run python -c "
          import json
          d = json.load(open('/tmp/gate.json'))
          assert d['decision'] == 'RUN_FULL', d
          assert d['n'] > 0, d
          print('gate verdict reproduced in CI:', d['decision'], d['measured_recall'])
          "

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-report
          path: /tmp/gate.md

  engine:
    name: engine round trip (live HydraDB on the runner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --extra dev

      - name: Start pinned HydraDB
        # Root cause of the old red job, found by strace and corrected in
        # hydradb#101: compose mounts the gitignored ./secrets/token, a CI
        # checkout lacks it, and Docker bind-mounts the missing path as a
        # DIRECTORY — the engine then dies reading its auth token with a raw
        # IsADirectory. Fix: provision the local-dev token before compose up.
        # Wipe-and-restart discipline per issue #81 unchanged.
        run: |
          mkdir -p secrets && printf 'local-development-token-32-bytes' > secrets/token
          mkdir -p hydradb-data/graph minio-data
          sudo chown -R 10001:10001 hydradb-data && chmod -R 777 minio-data
          docker compose up -d
          for i in $(seq 1 90); do
            if uv run python -c "
          from friction.client import connect
          from friction.config import Settings
          connect(Settings.from_env(), prefer='bolt').close()
          " 2>/dev/null; then echo "engine up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "engine did not become reachable"; docker compose logs; exit 1

      - name: Bolt round-trip proof
        run: uv run python scripts/hydra_proof.py | tee hydra-proof.log

      - name: Wipe the store and restart (issue 81 discipline)
        run: |
          docker compose down -v
          sudo rm -rf hydradb-data
          mkdir -p hydradb-data/graph && sudo chown -R 10001:10001 hydradb-data
          docker compose up -d
          for i in $(seq 1 60); do
            if uv run python -c "
          from friction.client import connect
          from friction.config import Settings
          connect(Settings.from_env(), prefer='bolt').close()
          " 2>/dev/null; then echo "clean store up after ${i}s"; break; fi
            sleep 1
          done

      - name: Engine-marked tests against a clean store
        run: |
          npm i -g @sourcegraph/scip-python >/dev/null 2>&1
          uv run pytest -q -m engine
