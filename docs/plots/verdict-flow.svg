<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 254" font-family="ui-monospace,'Geist Mono','JetBrains Mono',Menlo,monospace" role="img" aria-label="the verdict, end to end"><rect width="1290" height="254" fill="#0a0a0a"/><text x="24" y="30" fill="#747474" font-size="11" letter-spacing="2">THE VERDICT, END TO END</text><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e2e2e"/></marker></defs><rect x="30" y="60" width="170" height="56" fill="#121212" stroke="#2e2e2e"/><text x="115.0" y="81.0" fill="#ffffff" font-size="13" text-anchor="middle" dominant-baseline="middle">change lands</text><text x="115.0" y="101.0" fill="#747474" font-size="10" text-anchor="middle" dominant-baseline="middle">PR / diff / instance</text><rect x="260" y="60" width="200" height="56" fill="#121212" stroke="#2e2e2e"/><text x="360.0" y="81.0" fill="#ffffff" font-size="13" text-anchor="middle" dominant-baseline="middle">backwards walk</text><text x="360.0" y="101.0" fill="#747474" font-size="10" text-anchor="middle" dominant-baseline="middle">CALLED_BY*1..6, bounded</text><rect x="520" y="60" width="210" height="56" fill="#121212" stroke="#2e2e2e"/><text x="625.0" y="81.0" fill="#ffffff" font-size="13" text-anchor="middle" dominant-baseline="middle">graph-complete?</text><text x="625.0" y="101.0" fill="#747474" font-size="10" text-anchor="middle" dominant-baseline="middle">frontier exhausted</text><rect x="520" y="160" width="210" height="56" fill="#121212" stroke="#f9c425"/><text x="625.0" y="181.0" fill="#ffffff" font-size="13" text-anchor="middle" dominant-baseline="middle">≠ program-complete</text><text x="625.0" y="201.0" fill="#747474" font-size="10" text-anchor="middle" dominant-baseline="middle">missing edges are invisible</text><rect x="790" y="60" width="220" height="56" fill="#121212" stroke="#2e2e2e"/><text x="900.0" y="81.0" fill="#ffffff" font-size="13" text-anchor="middle" dominant-baseline="middle">measured recall</text><text x="900.0" y="101.0" fill="#747474" font-size="10" text-anchor="middle" dominant-baseline="middle">vs FAIL_TO_PASS labels</text><rect x="1070" y="26" width="190" height="52" fill="#121212" stroke="#2e2e2e"/><text x="1165.0" y="45.0" fill="#ffffff" font-size="13" text-anchor="middle" dominant-baseline="middle">SKIP_SAFE</text><text x="1165.0" y="65.0" fill="#747474" font-size="10" text-anchor="middle" dominant-baseline="middle">recall ≥ 0.95 · exit 0</text><rect x="1070" y="110" width="190" height="52" fill="#1a0f0a" stroke="#ff571a"/><text x="1165.0" y="129.0" fill="#ffffff" font-size="13" text-anchor="middle" dominant-baseline="middle">RUN_FULL</text><text x="1165.0" y="149.0" fill="#747474" font-size="10" text-anchor="middle" dominant-baseline="middle">recall < bar · exit 1</text><line x1="200" y1="88" x2="260" y2="88" stroke="#2e2e2e" marker-end="url(#ah)"/><line x1="460" y1="88" x2="520" y2="88" stroke="#2e2e2e" marker-end="url(#ah)"/><line x1="625" y1="116" x2="625" y2="160" stroke="#f9c425" stroke-dasharray="3 4" marker-end="url(#ah)"/><line x1="730" y1="88" x2="790" y2="88" stroke="#2e2e2e" marker-end="url(#ah)"/><line x1="1010" y1="78" x2="1070" y2="52" stroke="#2e2e2e" marker-end="url(#ah)"/><line x1="1010" y1="98" x2="1070" y2="136" stroke="#ff571a" marker-end="url(#ah)"/><text x="1075" y="196" fill="#747474" font-size="11">every graph class measured so far exits here</text><text x="24" y="238" fill="#747474" font-size="11">the gate is fail-closed: an unmeasured graph can never license a skip — RUN_FULL is the product working, not a failure mode</text></svg>