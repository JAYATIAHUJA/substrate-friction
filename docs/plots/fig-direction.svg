<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 252" font-family="ui-monospace,'Geist Mono','JetBrains Mono',Menlo,monospace" role="img" aria-label="direction: the relation every prior version measured backwards"><rect width="860" height="252" fill="#0a0a0a"/><text x="24" y="30" fill="#747474" font-size="11" letter-spacing="2">DIRECTION: THE RELATION EVERY PRIOR VERSION MEASURED BACKWARDS</text><text x="318" y="77.0" fill="#dadada" font-size="12.5" text-anchor="end">fix → test (directed)</text><rect x="330" y="56" width="434" height="34" fill="#121212" stroke="#2e2e2e"/><rect x="330" y="56" width="2" height="34" fill="#747474"/><text x="342" y="77.0" fill="#ffffff" font-size="13" font-weight="bold">0%</text><text x="402" y="77.0" fill="#747474" font-size="11">code does not call its tests</text><text x="318" y="127.0" fill="#dadada" font-size="12.5" text-anchor="end">test → fix (directed)</text><rect x="330" y="106" width="434" height="34" fill="#121212" stroke="#2e2e2e"/><rect x="330" y="106" width="236.72727272727272" height="34" fill="#ff571a"/><text x="576.7272727272727" y="127.0" fill="#ffffff" font-size="13" font-weight="bold">55%</text><text x="338" y="127.0" fill="#0a0a0a" font-size="11">the natural direction</text><text x="318" y="177.0" fill="#dadada" font-size="12.5" text-anchor="end">undirected ('both')</text><rect x="330" y="156" width="434" height="34" fill="#121212" stroke="#2e2e2e"/><rect x="330" y="156" width="424.1363636363636" height="34" fill="#f9c425"/><text x="764.1363636363636" y="177.0" fill="#ffffff" font-size="13" font-weight="bold">98%</text><text x="338" y="177.0" fill="#0a0a0a" font-size="11">shares a neighbourhood — NOT coverage</text><text x="24" y="236" fill="#747474" font-size="11">the 55%→98% gap is the pytest fixture/setUp/dispatch closure a static graph cannot record. source: docs/connectivity.md</text></svg>