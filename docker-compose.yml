services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["./minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 2s
      retries: 30

  graph-node:
    image: ghcr.io/hydra-db/hydradb:latest
    user: "10001:10001"
    depends_on:
      minio: { condition: service_started }
    environment:
      RUST_MIN_STACK: "33554432"
      CLOUD_PROVIDER: "local"
      LOCAL_PATH: "/data/graph"
      GRAPH_NAMESPACE: "default"
      GRAPH_ID: "default"
      GRAPH_CELL_ID: "cell-0"
      # GRAPH_CELLS is the cell-id membership list, not a count. The brief's
      # literal "1" leaves the node with no cell named "cell-0" (the value of
      # GRAPH_CELL_ID and the cell_id sent on every query), so it must name the
      # cell explicitly for the node to serve queries.
      GRAPH_CELLS: "cell-0"
      GRAPH_NODE_ID: "node-0"
      # GRAPH_BOLT_NODE_ADDRESSES is a "<node-id>=<addr>" membership mapping.
      # The brief's bare "0.0.0.0:7687" omits the node id and is not parsed as a
      # member address, so it is keyed by GRAPH_NODE_ID ("node-0") here.
      GRAPH_BOLT_NODE_ADDRESSES: "node-0=0.0.0.0:7687"
      GRAPH_ADVERTISED_BOLT_ADDR: "127.0.0.1:7687"
      GRAPH_DATA_CACHE_DIR: "/data/cache"
      GRAPH_AUTH_TOKEN_FILE: "/run/secrets/token"
      GRAPH_ALLOW_PLAINTEXT: "true"
    ports: ["7687:7687", "8443:8443", "9090:9090"]
    volumes:
      - "./hydradb-data:/data"
      - "./secrets/token:/run/secrets/token:ro"
