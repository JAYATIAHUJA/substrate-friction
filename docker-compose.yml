# =============================================================================
# Substrate Friction — local stack (graph-node + MinIO).
#
# One command brings this up and loads the shipped graph: `./setup.sh`.
# `docker compose up -d` alone starts an EMPTY engine; setup.sh also loads the
# pre-built subgraphs and materialises data/instances/ so `friction check` runs.
# =============================================================================
services:
  minio:
    # NOTE: graph-node below runs CLOUD_PROVIDER=local (a SlateDB
    # LocalFileSystem backend under ./hydradb-data), so it does NOT talk to
    # MinIO in this configuration. MinIO is kept only so the same compose file
    # can be flipped to an S3-compatible object store (CLOUD_PROVIDER=s3 with
    # the MinIO endpoint) without editing the topology. It is inert for the
    # judge path and can be omitted with `docker compose up -d graph-node`.
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["./minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 2s
      retries: 30

  graph-node:
    # Pinned by digest: the exact image every number in docs/ was measured
    # against (docs/pinned-engine-commit.txt has the source commit).
    image: ghcr.io/hydra-db/hydradb@sha256:db78309a233be54662db29744047e985a39b51c45a270d1a1f47c31a62cdb709
    user: "10001:10001"
    depends_on:
      minio: { condition: service_started }
    environment:
      RUST_MIN_STACK: "33554432"
      # -----------------------------------------------------------------------
      # OBJECT-STORE DEFECT (github.com/hydra-db/hydradb/issues/81)
      #   READ THIS BEFORE SCALING THE WORKING SET.
      #
      # CLOUD_PROVIDER=local is the engine's OWN documented local configuration
      # (from its README): a SlateDB LocalFileSystem backend. That backend has
      # no conditional put. Under SUSTAINED WRITES its manifest garbage
      # collection / compaction eventually needs a conditional put (PutMode::Update)
      # and fails with:
      #   "Operation put_opts with mode PutMode::Update not yet implemented
      #    by LocalFileSystem"
      # This is reached after ~6.1 GB of cumulative writes. From that point the
      # manifest GC is wedged: ALL writes fail permanently and query latency
      # collapses by orders of magnitude — but READS KEEP SERVING, so the node
      # still answers /readyz and still returns query results and therefore
      # LOOKS HEALTHY. Read health is NOT liveness here. (An earlier version of
      # this project mis-measured a "150-node traversal ceiling" against exactly
      # such a silently-degraded store; see the retraction in
      # docs/engine-scaling.md.)
      #
      # We keep the local backend anyway for judge simplicity (no S3 creds,
      # no MinIO wiring). It is SAFE here because setup.sh loads a DELIBERATELY
      # SMALL working set: 3 named instances x 2 arms (~33k nodes / ~62k edges,
      # a fraction of the 17 MB shipped corpus) — a one-shot load of well under
      # 1 GB of writes, nowhere near the ~6.1 GB threshold. The full 50-instance
      # shipped corpus (623,978 nodes / 1,186,841 edges if all loaded) is on disk
      # for optional per-instance live loads, but is NOT bulk-loaded here.
      # `friction compare`/`delta` are cache-backed and need no engine at all.
      # Do NOT loop the loader or bulk-ingest all 50 neighbourhoods into a
      # persistent ./hydradb-data volume; if you need heavy/iterative ingest,
      # switch CLOUD_PROVIDER to s3 against the MinIO service above.
      # -----------------------------------------------------------------------
      CLOUD_PROVIDER: "local"
      LOCAL_PATH: "/data/graph"
      GRAPH_NAMESPACE: "default"
      GRAPH_ID: "default"
      GRAPH_CELL_ID: "cell-0"
      # GRAPH_CELLS is the cell-id membership list, not a count. The brief's
      # literal "1" leaves the node with no cell named "cell-0" (the value of
      # GRAPH_CELL_ID and the cell_id sent on every query), so it must name the
      # cell explicitly for the node to serve queries.
      GRAPH_CELLS: "cell-0"
      GRAPH_NODE_ID: "node-0"
      # GRAPH_BOLT_NODE_ADDRESSES is a "<node-id>=<addr>" membership mapping.
      # The brief's bare "0.0.0.0:7687" omits the node id and is not parsed as a
      # member address, so it is keyed by GRAPH_NODE_ID ("node-0") here.
      GRAPH_BOLT_NODE_ADDRESSES: "node-0=0.0.0.0:7687"
      GRAPH_ADVERTISED_BOLT_ADDR: "127.0.0.1:7687"
      GRAPH_DATA_CACHE_DIR: "/data/cache"
      GRAPH_AUTH_TOKEN_FILE: "/run/secrets/token"
      GRAPH_ALLOW_PLAINTEXT: "true"
    ports: ["7687:7687", "8443:8443", "9090:9090"]
    volumes:
      - "./hydradb-data:/data"
      - "./secrets/token:/run/secrets/token:ro"
